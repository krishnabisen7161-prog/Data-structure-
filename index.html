<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DS Quest - Data Structure Learning Portal</title>

    <!-- ================= CSS ================= -->
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1020;
            color: white;
            min-height: 100vh;
        }

        /* ---------- HEADER ---------- */

        header {
            background: #111936;
            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #26345f;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00eaff;
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat {
            background: #1a2447;
            padding: 8px 14px;
            border-radius: 10px;
        }

        /* ---------- MAIN CONTAINER ---------- */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* ---------- HERO ---------- */

        .hero {
            background: linear-gradient(135deg, #162452, #10172e);

            padding: 30px;

            border-radius: 20px;

            border: 1px solid #293b70;

            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 34px;
            color: #00eaff;
            margin-bottom: 10px;
        }

        .hero p {
            color: #b8c2df;
            line-height: 1.6;
        }

        /* ---------- XP BAR ---------- */

        .xp-box {
            margin-top: 20px;
        }

        .xp-text {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;
        }

        .xp-bar {
            height: 12px;

            background: #252e4d;

            border-radius: 20px;

            overflow: hidden;
        }

        .xp-fill {
            width: 35%;
            height: 100%;

            background: linear-gradient(
                90deg,
                #00eaff,
                #7b5cff
            );

            transition: 0.4s;
        }

        /* ---------- LEVEL TITLE ---------- */

        .section-title {
            margin-bottom: 18px;
            font-size: 25px;
        }

        /* ---------- LEVEL CARDS ---------- */

        .levels {
            display: grid;

            grid-template-columns:
            repeat(auto-fit, minmax(220px, 1fr));

            gap: 18px;
        }

        .card {
            background: #141d38;

            border: 1px solid #29365f;

            border-radius: 18px;

            padding: 22px;

            transition: 0.3s;

            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);

            border-color: #00eaff;

            box-shadow:
            0 0 20px rgba(0, 234, 255, 0.15);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            color: #9ca8c8;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 18px;
        }

        /* ---------- BUTTON ---------- */

        button {
            border: none;

            padding: 10px 18px;

            border-radius: 10px;

            background: #00c8e8;

            color: #07101d;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #5beaff;

            transform: scale(1.03);
        }

        button:disabled {
            cursor: not-allowed;
        }

        /* ---------- LOCKED CARD ---------- */

        .locked {
            opacity: 0.5;
        }

        .lock {
            position: absolute;

            right: 18px;

            top: 18px;

            font-size: 20px;
        }

        /* ---------- QUIZ ---------- */

        .quiz-section {
            margin-top: 35px;

            background: #141d38;

            padding: 25px;

            border-radius: 18px;

            border: 1px solid #29365f;
        }

        .quiz-section h2 {
            color: #00eaff;
        }

        .question {
            font-size: 20px;

            margin: 15px 0;
        }

        .options {
            display: grid;

            gap: 10px;
        }

        .option {
            background: #202b4d;

            color: white;

            text-align: left;

            width: 100%;
        }

        .option:hover {
            background: #2d3b66;
        }

        .result {
            margin-top: 15px;

            font-weight: bold;

            min-height: 24px;
        }

        /* ---------- FOOTER ---------- */

        footer {
            text-align: center;

            padding: 30px;

            color: #7784a8;
        }

        /* ---------- MOBILE ---------- */

        @media(max-width: 600px) {

            header {
                flex-direction: column;

                gap: 15px;
            }

            .hero h1 {
                font-size: 27px;
            }

            .stats {
                font-size: 13px;
            }

            .hero {
                padding: 22px;
            }

        }

    </style>
</head>


<body>


<!-- =====================================================
                     HEADER
===================================================== -->

<header>

    <div class="logo">
        ⚡ DS QUEST
    </div>

    <div class="stats">

        <div class="stat">
            ⭐ XP:
            <span id="xp">350</span>
        </div>

        <div class="stat">
            🏆 Level:
            <span id="level">3</span>
        </div>
